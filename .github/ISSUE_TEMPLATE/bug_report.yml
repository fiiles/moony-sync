name: Bug report
description: Something in the Moony sync server does not work as expected
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Never paste** a connection code, an account number, a token, a setup code, the admin
        password or a backup archive, and replace your server's address with `sync.example.com`.
        If you found a **security problem**, do not file it here; follow the security policy
        (SECURITY.md in the repository, or the "Security" tab).
  - type: input
    id: version
    attributes:
      label: Server version
      description: The commit you built from (`git rev-parse --short HEAD`), or the version shown by `GET /v1/server`.
      placeholder: e.g. 1.0.0, commit abc1234
    validations:
      required: true
  - type: dropdown
    id: run
    attributes:
      label: How do you run it?
      options:
        - Docker with compose.yml
        - Docker, another way
        - Node without Docker
    validations:
      required: true
  - type: input
    id: proxy
    attributes:
      label: Reverse proxy
      description: Which one, if any (Caddy, Nginx Proxy Manager, nginx …), and whether `TRUST_PROXY=1` is set.
      placeholder: e.g. Caddy on the same machine, TRUST_PROXY=1
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      description: Include the exact error text from the admin page or from Moony.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: The relevant lines of `docker compose logs moony-sync`. Remove the `Setup code:` line.
      render: text
