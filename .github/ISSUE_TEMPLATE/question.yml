name: Question
description: Ask how to run or set up the Moony sync server
title: '[Question]: '
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        README.md covers running the server, the reverse proxy, backup and the admin page;
        DESIGN.md covers the protocol and what the server stores. If the answer is not there,
        ask here.

        **Never paste** a connection code, an account number, a token, a setup code, the admin
        password or a backup archive, and replace your server's address with `sync.example.com`.
        Do not describe a **security problem** here; follow the security policy (SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: How you run the server
      description: Docker or Node, and the reverse proxy in front, if it matters for the question.
